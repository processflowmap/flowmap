function zoomStep(f){
  const v = view(); const r = svg.getBoundingClientRect();
  const mx = r.width/2, my = r.height/2;
  const k2 = clamp(v.k * f, 0.15, 3);
  v.tx = mx - (mx - v.tx) * (k2 / v.k);
  v.ty = my - (my - v.ty) * (k2 / v.k);
  v.k = k2; render(); save();
}
function fitToView(){
  const bb = contentBBox(50);
  const r = svg.getBoundingClientRect();
  const k = clamp(Math.min(r.width / bb.w, r.height / bb.h), 0.15, 2);
  const v = view();
  v.k = k;
  v.tx = (r.width - bb.w * k) / 2 - bb.x * k;
  v.ty = (r.height - bb.h * k) / 2 - bb.y * k;
  render(); save();
}

/* ============================================================
   Export / Import
   ============================================================ */
function download(name, content, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type:mime || 'application/octet-stream' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
/* Shared atomic replacement path for Import JSON, blank maps, and templates.
   Candidate validation/normalization happens before confirmation and before any
   live document, selection, or history state is changed. */
function installPreparedDocument(prepared, { forceCanvas=false, fitContent=false, successMessage='Diagram loaded' }={}){
  doc = mergeDocumentDefaults(prepared);
  normalizeBlocks();
  if(forceCanvas){
    doc.mode = 'canvas';
    doc.views.canvas = Object.assign({}, newDoc().views.canvas);
  }
  doc.appVersion = APP_VERSION;
  undoStack = []; redoStack = []; updateUndoBtns();
  sel.blocks.clear(); sel.edges.clear();
  hoverId = null; trace = null; gesture = null;
  fillAxisDropdowns();
  setModeUI(doc.mode);
  $('#edgeStyle').value = doc.edgeStyle;
  applyBadgesBtn();
  applyDrawer();
  renderPanel();
  afterMutation();
  if(fitContent && doc.blocks.length) fitToView();
  toast(successMessage);
}
function requestReplacement(candidate, options={}){
  const name = options.name || 'Template';
  let prepared;
  try{
    prepared = prepareReplacement(candidate, { strict:!!options.strict, name });
  }catch(err){
    toast(options.strict ? err.message : 'Invalid flowmap JSON file');
    return false;
  }
  const message = options.confirmMessage || `Load ${name}? This will replace the current map.`;
  if(!confirm(message)) return false;
  installPreparedDocument(prepared, options);
  return true;
}
function requestBlankMap(){
  return requestReplacement(newDoc(), {
    strict:true,
    name:'Blank map',
    confirmMessage:'Create a new blank map? This will replace the current map.',
    successMessage:'Blank map created',
    forceCanvas:true,
    fitContent:false,
  });
}

$('#expJson').addEventListener('click', () => {
  download('flowmap.json', JSON.stringify(doc, null, 2), 'application/json');
});
$('#impJson').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', ev => {
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      requestReplacement(d, {
        name:'Import',
        confirmMessage:'Import will replace the current diagram. Continue?',
        successMessage:'Diagram imported',
      });
    }catch(err){ toast('Invalid flowmap JSON file'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
});

/* OPTIONAL (nice-to-have): PNG export of the current viewport.
   Serializes the SVG into an offscreen canvas. Uses only system fonts, so it
   works fully offline. If rasterization fails in some browser, a toast
   explains instead of breaking anything. */
$('#expPng').addEventListener('click', () => {
  try{
    const r = svg.getBoundingClientRect();
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', SVGNS);
    clone.setAttribute('width', r.width); clone.setAttribute('height', r.height);
    const css = document.createElement('style');
    css.textContent = `.lead{fill:${themeColor('surface')};stroke:${themeColor('muted')};stroke-width:1.5}.block.dim,.edge.dim{opacity:.25}`;
    clone.insertBefore(css, clone.firstChild);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type:'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = r.width * 2; c.height = r.height * 2;
      const ctx = c.getContext('2d');
      ctx.fillStyle = themeColor('canvas'); ctx.fillRect(0, 0, c.width, c.height);
      ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'flowmap.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      });
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('PNG export is not supported in this browser'); };
    img.src = url;
  }catch(err){ toast('PNG export failed'); }
});

    <h2>Welcome to FlowMap</h2>

/* generic dismissible modal card (Esc / ✕ / scrim-click) */
function showCard(innerHtml, wide){
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="card ${wide ? 'wide' : ''}" role="dialog">${innerHtml}</div>`;
  document.body.appendChild(scrim);
  const onKey = ev => { if(ev.key === 'Escape'){ close(); ev.stopPropagation(); } };
  function close(){ scrim.remove(); window.removeEventListener('keydown', onKey, true); }
  window.addEventListener('keydown', onKey, true);
  scrim.addEventListener('pointerdown', ev => { if(ev.target === scrim) close(); });
  const x = scrim.querySelector('.x');
  if(x) x.addEventListener('click', close);
  return close;
}

function showTemplatePicker(){
  closeMenus();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="card wide" role="dialog" aria-modal="true" aria-labelledby="templateTitle">
    <h2 id="templateTitle">New from template <button class="x" aria-label="Close">✕</button></h2>
    <p class="template-warning">Loading replaces the current map. You will be asked to confirm before anything changes.</p>
    <div class="template-list"></div>
    <div class="card-actions"><button class="linklike" id="templateCancel">Cancel</button></div>
  </div>`;
  document.body.appendChild(scrim);
  const list = scrim.querySelector('.template-list');

  function close(){
    if(!scrim.isConnected) return;
    scrim.remove();
    window.removeEventListener('keydown', onKey, true);
    $('#fileBtn').focus();
  }
  function addEntry(name, description, load){
    const row = document.createElement('div');
    row.className = 'template-entry';
    const copy = document.createElement('div');
    copy.className = 'template-copy';
    const heading = document.createElement('div');
    heading.className = 'template-name';
    heading.textContent = name;
    const desc = document.createElement('div');
    desc.className = 'template-description';
    desc.textContent = description;
    copy.append(heading, desc);
    const button = document.createElement('button');
    button.className = 'tbtn';
    button.type = 'button';
    button.textContent = 'Load';
    button.setAttribute('aria-label', `Load ${name}`);
    button.addEventListener('click', () => { if(load()) close(); });
    row.append(copy, button);
    list.appendChild(row);
  }

  addEntry('Blank map', 'Start with an empty Canvas and default view settings.', requestBlankMap);
  for(const entry of TEMPLATE_CATALOG){
    addEntry(String(entry.name || entry.id || 'Template'), String(entry.description || ''), () =>
      requestReplacement(entry.document, {
        strict:true,
        name:String(entry.name || entry.id || 'Template'),
        confirmMessage:`Load ${String(entry.name || entry.id || 'template')}? This will replace the current map.`,
        successMessage:`Loaded ${String(entry.name || entry.id || 'template')}`,
        forceCanvas:true,
        fitContent:true,
      }));
  }

  const onKey = ev => {
    if(ev.key === 'Escape'){ close(); ev.stopPropagation(); ev.preventDefault(); return; }
    if(ev.key !== 'Tab') return;
    const focusable = [...scrim.querySelectorAll('button:not(:disabled)')];
    const first = focusable[0], last = focusable[focusable.length - 1];
    if(ev.shiftKey && document.activeElement === first){ last.focus(); ev.preventDefault(); }
    else if(!ev.shiftKey && document.activeElement === last){ first.focus(); ev.preventDefault(); }
  };
  window.addEventListener('keydown', onKey, true);
  scrim.addEventListener('pointerdown', ev => { if(ev.target === scrim) close(); });
  scrim.querySelector('.x').addEventListener('click', close);
  scrim.querySelector('#templateCancel').addEventListener('click', close);
  const firstLoad = list.querySelector('button');
  if(firstLoad) firstLoad.focus();
}

      <li><kbd>B</kbd> toggles the data table drawer</li>
      <li>Badges button shows owner &amp; stack on blocks</li>
      <li><kbd>?</kbd> opens this sheet</li>
    </ul></div>
    <div class="sc-group"><h3>Modes</h3><ul>
      <li>Canvas · Matrix · Hybrid · Table in the toolbar</li>
      <li>Matrix/Hybrid: drag a block to another cell to reassign</li>
    </ul></div>
  </div>`, true);
}
function showWhatsNew(){
  showCard(`<h2>What's new in v${APP_VERSION} <button class="x">✕</button></h2>
  <ul style="padding-left:18px; margin-bottom:8px">
    <li><b>Stable Matrix and Hybrid routing:</b> Canvas custom waypoints no longer leak into automatically arranged views or create diagonal cross-lane lines</li>
    <li><b>Canvas custom routes are preserved:</b> switch views freely and your custom channel returns when you come back to Canvas</li>
    <li><b>Reliable endpoint reattachment:</b> moving either connected block keeps source and target leads horizontal</li>
    <li><b>Orthogonal safety:</b> invalid custom geometry falls back safely instead of rendering diagonal Square segments</li>
  </ul>
  <p style="color:var(--muted); font-size:12px">v1.2.3: draggable Square segments · persistent per-edge route controls · stronger automatic optimization.<br>
    v1.2.2: obstacle-aware Square routing and deterministic crossing reduction.<br>
    v1.2.1: System, Light, or Dark appearance · tinted loop blocks and solid amber cycle edges.<br>
    v1.2: File menu · offline templates · decimal resources.<br>
    v1.1: owner and stack badges on blocks · editable data table drawer.</p>`);
}
function showAbout(){
  showCard(`<h2>About &amp; Privacy <button class="x">✕</button></h2>
  <p>FlowMap is a free, open-source process-flow mapping tool. All data is stored locally in your browser — nothing leaves your device.</p>
  <p style="color:var(--muted)">FlowMap v${APP_VERSION}</p>`);
}

// ⓘ help menu (same dropdown pattern as Add-block)
const helpDD = $('#helpDD'), helpMenu = $('#helpMenu');
[
  ['Keyboard shortcuts', () => showShortcuts()],
  ["What's new",         () => showWhatsNew()],
  ['About & Privacy',    () => showAbout()],
  ['Feedback / Report a bug', () => window.open(FEEDBACK_URL, '_blank', 'noopener')],
  ['View source on GitHub',   () => window.open(REPO_URL, '_blank', 'noopener')],
].forEach(([label, fn]) => {
  const item = document.createElement('div');
  item.className = 'dd-item';
  item.textContent = label;
  item.addEventListener('click', () => { helpDD.classList.remove('open'); fn(); });
  helpMenu.appendChild(item);
});
$('#helpBtn').addEventListener('click', () => {
  closeMenus(helpDD);
  helpDD.classList.toggle('open');
  if(helpDD.classList.contains('open')) placeMenu($('#helpBtn'), helpMenu, true);
});
// swiping the toolbar horizontally on touch devices closes any open menu
$('#toolbar').addEventListener('scroll', () => closeMenus(), { passive:true });

/* ============================================================
   Init
   ============================================================ */
function setModeUI(m){
  $('#modeCanvas').classList.toggle('active', m === 'canvas');
  $('#modeMatrix').classList.toggle('active', m === 'matrix');
  $('#modeHybrid').classList.toggle('active', m === 'hybrid');
  $('#modeTable').classList.toggle('active', m === 'table');
  $('#matrixAxes').style.display = (m === 'matrix' || m === 'hybrid') ? 'flex' : 'none';
}
function init(){
  const loaded = load();
  const isFirstRun = !loaded;          // simplest correct "demo on first run" signal
  doc = loaded || demoDoc();
  // migrate older saves: fill any fields introduced after schemaVersion 1 shipped
  const base = newDoc();
  doc.views = Object.assign(base.views, doc.views || {});
  doc.ui = Object.assign(base.ui, doc.ui || {});
  if(!doc.edgeStyle) doc.edgeStyle = 'square';
  normalizeBlocks();
  // version-update toast (§7): once per version, only for existing saved docs —
  // first-run docs are not saved here so the hint signal (load() → null) survives
  if(!isFirstRun && doc.appVersion !== APP_VERSION){
    doc.appVersion = APP_VERSION;
    save();
    setTimeout(() => toast(`Updated to v${APP_VERSION} — see What's new in the ⓘ menu.`), 500);
  }
  doc.appVersion = APP_VERSION;
  fillAxisDropdowns();
  setModeUI(doc.mode);
  $('#edgeStyle').value = doc.edgeStyle;
  applyBadgesBtn();
  applyDrawer();
  computeCycles();
  render();
  updateUndoBtns();
  // first-run guided hint (§1): only when the demo was just created, never for upgrades
  if(isFirstRun){
    let seen = null;
    try{ seen = localStorage.getItem(HINT_KEY); }catch(e){}
    if(seen === null) showHint();
  }
}
initTheme();
init();
</script>
