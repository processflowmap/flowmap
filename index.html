<!DOCTYPE html>
<!--
  flowmap.html — Process Flow Mapping Tool
  =========================================
  A single-file, zero-dependency process flow mapper. Works fully offline (file://).
  Usage:
    • Toolbar: switch Canvas | Matrix | Hybrid mode, add blocks (5 types), undo/redo,
      zoom, fit, edge style (Square | Curved), export/import.
    • Canvas mode: drag blocks freely (10px snap grid + alignment guides). Design space.
    • Matrix mode: pick X/Y axis properties; blocks auto-stack into cells; drag a block
      into another cell to reassign its properties. Assignment space.
    • Hybrid mode: strict Y lanes like matrix, but X bands follow the canvas flow order
      and the X-property label may repeat along the flow. Analysis & tweak space.
    • Table mode: activities in approximate flow order with all properties as editable
      fields, including man-hours and assigned resources; time to complete is
      calculated as man-hours ÷ resources.
    • Drag from a block's output lead (right circle) onto another block to connect.
    • Hover a block to trace its upstream (blue) / downstream (green) chains.
    • Click a block or edge to select; Shift+click or marquee for multi-select; Delete removes.
    • Ctrl+Z / Ctrl+Y undo/redo, Ctrl+D duplicate, Esc clears selection.
    • Everything autosaves to localStorage (key "flowmap.v1").
-->

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<script>
  // Apply appearance before first paint; the main script owns subsequent changes.
  (() => {
    let preference = 'system';
    try{
      const saved = localStorage.getItem('flowmap.v1.theme');
      if(['system','light','dark'].includes(saved)) preference = saved;
    }catch(e){}
    const dark = preference === 'dark' ||
      (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#0a0a0f' : '#ffffff';
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FlowMap">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // Service worker: cache-first offline support. No-ops from file:// and fails
  // silently everywhere else — the app never depends on it.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
<style>
  :root{
    --canvas:#ffffff; --surface:#ffffff; --block:#ffffff; --surface-alt:#f6f8fa;
    --border:#d0d7de; --border-soft:#eaeef2; --text:#1f2328; --muted:#57606a;
    --accent:#0969da; --accent-hover:#0860c4; --on-accent:#ffffff;
    --up:#1e88e5; --down:#43a047; --warn:#ff9800; --guide:#ff4081; --danger:#f44336;
    --crit-low:#4caf50; --crit-medium:#ff9800; --crit-high:#f44336; --crit-critical:#8e24aa;
    --grid-dot:#d0d7de; --selected-bg:#ddf4ff; --hover:#eaeef2; --ghost-fill:rgba(9,105,218,.10);
    --loop-fill:#fff3d6; --toast-bg:#24292f; --toast-text:#ffffff;
    --scrim:rgba(31,35,40,.35); --hint-ring:rgba(9,105,218,.24);
    --shadow-menu:0 8px 24px rgba(140,149,159,.25);
    --shadow-card:0 16px 48px rgba(31,35,40,.25);
    --shadow-drawer:0 -6px 18px rgba(31,35,40,.10);
    --shadow-toast:0 6px 16px rgba(0,0,0,.25);
  }
  html[data-theme="dark"]{
    --canvas:#0a0a0f; --surface:#14141c; --block:#181820; --surface-alt:#111119;
    --border:#3a3a48; --border-soft:#2b2b36; --text:#f5f4eb; --muted:#b8b6ad;
    --accent:#5ce1e6; --accent-hover:#82edf0; --on-accent:#0a0a0f;
    --up:#5ce1e6; --down:#7ed957; --warn:#dfa54f; --guide:#ff6b9d; --danger:#ff7b72;
    --crit-low:#7ed957; --crit-medium:#dfa54f; --crit-high:#ff7b72; --crit-critical:#d2a8ff;
    --grid-dot:#343440; --selected-bg:#16363c; --hover:#262633; --ghost-fill:rgba(92,225,230,.12);
    --loop-fill:#382d1d; --toast-bg:#20202a; --toast-text:#f5f4eb;
    --scrim:rgba(0,0,0,.62); --hint-ring:rgba(92,225,230,.30);
    --shadow-menu:0 8px 24px rgba(0,0,0,.50);
    --shadow-card:0 16px 48px rgba(0,0,0,.55);
    --shadow-drawer:0 -6px 18px rgba(0,0,0,.35);
    --shadow-toast:0 6px 16px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); background:var(--canvas);}
  button,select,input{font:inherit; color:inherit;}

  /* ---------- Toolbar ---------- */
  #toolbar{
    position:fixed; top:0; left:0; right:0; height:46px; z-index:30;
    display:flex; align-items:center; gap:6px; padding:0 10px;
    background:var(--surface-alt); border-bottom:1px solid var(--border);
    overflow-x:auto; scrollbar-width:thin;           /* narrow-screen: swipe the bar */
  }
  #toolbar .brand{font-weight:600; margin-right:8px; white-space:nowrap; flex-shrink:0;}
  .tb-group{display:flex; align-items:center; gap:4px; padding:0 8px; border-left:1px solid var(--border); flex:none;}
  .tb-group .tbtn, .tb-group select, .tb-group label{flex:none;}
  .tb-group:first-of-type{border-left:none;}
  .tbtn{
    border:1px solid var(--border); background:var(--surface); border-radius:6px;
    padding:4px 10px; cursor:pointer; white-space:nowrap;
  }
  .tbtn:hover{background:var(--hover);}
  .tbtn.active{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .tbtn:disabled{opacity:.45; cursor:default;}
  #matrixAxes{display:none; align-items:center; gap:6px;}
  #matrixAxes select{max-width:150px; padding:3px 4px; border:1px solid var(--border); border-radius:6px; background:var(--surface);}
  .tb-spacer{flex:1;}

  /* dropdown menus — position:fixed so the scrollable toolbar can't clip them */
  .dd-menu{
    display:none; position:fixed; z-index:40;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-menu);
    min-width:150px; padding:4px;
  }
  .dd.open .dd-menu{display:block;}
  .dd-item{width:100%; padding:6px 10px; border:0; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:8px;
    background:none; text-align:left; font:inherit;}
  .dd-item:hover{background:var(--hover);}
  .dd-item:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .dd-item svg{flex:none;}

  /* ---------- Template picker (v1.2) ---------- */
  .template-warning{color:var(--muted); font-size:12px;}
  .template-list{display:grid; gap:0; max-height:52vh; overflow-y:auto; margin:4px -6px 0;}
  .template-entry{display:flex; align-items:center; gap:16px; padding:12px 6px; border-top:1px solid var(--border-soft);}
  .template-entry:first-child{border-top:0;}
  .template-copy{flex:1; min-width:0;}
  .template-name{font-weight:600; margin-bottom:2px;}
  .template-description{color:var(--muted); font-size:12px; line-height:1.5;}
  .template-entry .tbtn{flex:none;}

  /* ---------- SVG canvas ---------- */
  #stage{position:fixed; inset:46px 0 0 0; background:var(--canvas);}
  #svg{width:100%; height:100%; display:block; cursor:default; user-select:none; -webkit-user-select:none;}
  #svg.panning{cursor:grabbing;}
  #svg.connecting{cursor:crosshair;}

  .block{cursor:grab;}
  .block.dim{opacity:.25;}
  .edge.dim{opacity:.25;}
  .edge{cursor:pointer;}
  .route-segment{touch-action:none;}
  .fld .btn:disabled{opacity:.45;cursor:default;}
  .lead{cursor:crosshair; fill:var(--surface); stroke:var(--muted); stroke-width:1.5;}
  .lead:hover{fill:var(--accent); stroke:var(--accent);}

  /* ---------- Table view ---------- */
  #tableWrap{display:none; position:fixed; inset:46px 0 0 0; overflow:auto; background:var(--surface); padding:0 22px 30px; z-index:20;}
  .grid{border-collapse:collapse; width:100%; font-size:13px;}
  .grid th{
    position:sticky; top:0; z-index:2; background:var(--surface-alt); border-bottom:2px solid var(--border);
    text-align:left; padding:8px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
    white-space:nowrap;
  }
  .grid td{padding:3px 8px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  .grid td.num, .grid th.num{text-align:right;}
  .grid tr:hover td{background:var(--surface-alt);}
  .grid tr.sel td{background:var(--selected-bg);}
  .grid tr.in-cycle td:first-child{border-left:3px solid var(--warn);}
  .grid tr.in-cycle td:first-child::after{content:' ⟳'; color:var(--warn);}
  .grid input[type=text], .grid input[type=number], .grid select{
    width:100%; min-width:60px; padding:3px 5px; border:1px solid transparent; border-radius:5px; background:transparent;
  }
  .grid input:hover, .grid select:hover{border-color:var(--border); background:var(--surface);}
  .grid input:focus, .grid select:focus{border-color:var(--accent); background:var(--surface); outline:none;}
  .grid input[type=number]{text-align:right; max-width:80px;}
  .grid .ttc{font-variant-numeric:tabular-nums; white-space:nowrap;}
  .grid .rel{color:var(--muted); max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .grid .ord{color:var(--muted); font-variant-numeric:tabular-nums;}

  /* ---------- Data table drawer (v1.1) ---------- */
  #drawer{display:none; position:fixed; left:0; right:0; bottom:0; z-index:15;
    background:var(--surface); border-top:1px solid var(--border); box-shadow:var(--shadow-drawer);}
  #drawerGrab{height:26px; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--muted); cursor:pointer; user-select:none;
    background:var(--surface-alt); border-bottom:1px solid var(--border);}
  #drawerGrab:hover{color:var(--accent);}
  #drawerBody{display:none; height:200px; overflow:auto; padding:0 22px 12px;}
  body.drawer-open #drawerBody{display:block;}
  /* stage bottom inset always equals the drawer's rendered height — it pushes
     content up, never overlays blocks (26px grabber / 226px open) */
  body.drawer-shut #stage{inset:46px 0 26px 0;}
  body.drawer-open #stage{inset:46px 0 226px 0;}
  body.drawer-shut #toasts{bottom:48px;}
  body.drawer-open #toasts{bottom:248px;}

  /* ---------- Property panel ---------- */
  #panel{
    position:fixed; top:46px; right:0; bottom:0; width:min(292px, 85vw); z-index:25;
    background:var(--surface); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .18s ease;
    display:flex; flex-direction:column;
  }
  #panel.open{transform:none;}
  #panel.collapsed{transform:translateX(calc(100% + 2px));}
  #panelTab{
    display:none; position:fixed; right:0; top:50%; transform:translateY(-50%); z-index:24;
    border:1px solid var(--border); border-right:none; background:var(--surface); color:var(--muted);
    border-radius:8px 0 0 8px; padding:14px 7px; cursor:pointer; writing-mode:vertical-rl;
    font-size:12px; letter-spacing:.5px; box-shadow:var(--shadow-menu);
  }
  #panelTab:hover{color:var(--accent); border-color:var(--accent);}
  #panel header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--border); font-weight:600;
  }
  #panel .close{border:none; background:none; font-size:16px; cursor:pointer; color:var(--muted);}
  #panel .body{flex:1; overflow-y:auto; padding:12px 14px;}
  .fld{margin-bottom:10px;}
  .fld label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px; text-transform:uppercase; letter-spacing:.4px;}
  .fld input[type=text], .fld input[type=number], .fld select, .fld textarea{
    width:100%; padding:5px 7px; border:1px solid var(--border); border-radius:6px; background:var(--surface);
  }
  .fld textarea{resize:vertical; min-height:52px;}
  .rel-list{list-style:none;}
  .rel-list li{padding:4px 7px; border:1px solid var(--border); border-radius:6px; margin-bottom:4px; background:var(--surface-alt);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .rel-list li:hover{border-color:var(--accent);}
  .rel-empty{color:var(--muted); font-style:italic;}
  #panel .actions{display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--border);}

  /* ---------- Lead connections popup ---------- */
  #leadPop{
    display:none; position:fixed; z-index:50; width:min(250px, 80vw); max-height:260px; overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-menu); padding:8px;
  }
  #leadPop h4{font-size:11px; text-transform:uppercase; color:var(--muted); margin:4px 2px 6px;}
  #leadPop .lp-row{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  #leadPop .lp-row .who{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #leadPop .lp-row input{width:70px; padding:2px 5px; border:1px solid var(--border); border-radius:5px;}
  #leadPop .lp-row button{border:none; background:none; color:var(--muted); cursor:pointer; font-size:14px;}
  #leadPop .lp-row button:hover{color:var(--danger);}

  /* ---------- Inline label editor ---------- */
  #inlineEdit{
    display:none; position:fixed; z-index:60; padding:4px 8px; text-align:center;
    border:1.5px solid var(--accent); border-radius:4px; outline:none; background:var(--surface);
  }

  /* ---------- Toasts ---------- */
  #toasts{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
  .toast{background:var(--toast-bg); color:var(--toast-text); padding:8px 16px; border-radius:8px; box-shadow:var(--shadow-toast);
    animation:tin .18s ease; max-width:70vw;}
  .toast.out{opacity:0; transition:opacity .3s;}
  @keyframes tin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* ---------- First-run hint & modal cards (§1/§2/§3) ---------- */
  .scrim{
    position:fixed; inset:0; z-index:80; background:var(--scrim);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow-card); max-width:420px; width:100%;
    padding:20px 22px; animation:tin .18s ease; max-height:85vh; overflow-y:auto;
  }
  .card h2{font-size:17px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
  .card h2 .x{border:none; background:none; font-size:16px; color:var(--muted); cursor:pointer;}
  .card p{margin-bottom:10px; color:var(--text);}
  .card .card-actions{display:flex; align-items:center; gap:14px; margin-top:14px;}
  .btn-primary{
    background:var(--accent); color:var(--on-accent); border:1px solid var(--accent); border-radius:6px;
    padding:6px 14px; cursor:pointer;
  }
  .btn-primary:hover{background:var(--accent-hover);}
  .linklike{border:none; background:none; color:var(--muted); cursor:pointer; text-decoration:underline; font-size:12px;}
  .card.wide{max-width:640px;}
  .sc-cols{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px;}
  @media (max-width:560px){ .sc-cols{grid-template-columns:1fr;} }
  .sc-group{margin-bottom:12px;}
  .sc-group h3{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin-bottom:5px;}
  .sc-group li{list-style:none; padding:2.5px 0; color:var(--text);}
  .sc-group kbd{
    background:var(--surface-alt); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px;
    padding:0 5px; font:11px ui-monospace,monospace;
  }
  /* gentle pulse on mode buttons while the hint is open */
  @keyframes hintPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(9,105,218,0);}
    50%{box-shadow:0 0 0 5px var(--hint-ring);}
  }
  .hint-pulse{animation:hintPulse 1.1s ease-in-out 2;}
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">FlowMap</span>
  <div class="tb-group">
    <button class="tbtn active" id="modeCanvas">Canvas</button>
    <button class="tbtn" id="modeMatrix">Matrix</button>

<script>

/* ---------------- Appearance (browser preference, never document data) ---------------- */
const themeMedia = matchMedia('(prefers-color-scheme: dark)');
let themePreference = 'system';
const SVG_TOKEN_MAP = {
  canvas:'--canvas', surface:'--surface', block:'--block', text:'--text', muted:'--muted',
  border:'--border', accent:'--accent', up:'--up', down:'--down', warn:'--warn', guide:'--guide',
  gridDot:'--grid-dot', ghostFill:'--ghost-fill', loopFill:'--loop-fill',
  critLow:'--crit-low', critMedium:'--crit-medium', critHigh:'--crit-high', critCritical:'--crit-critical',
};
let svgTheme = {};
function resolvedTheme(){ return themePreference === 'system' ? (themeMedia.matches ? 'dark' : 'light') : themePreference; }
function refreshSvgTheme(){
  const styles = getComputedStyle(document.documentElement);
  for(const [name, token] of Object.entries(SVG_TOKEN_MAP)) svgTheme[name] = styles.getPropertyValue(token).trim();
}
function themeColor(name){ return svgTheme[name]; }
function syncThemeMenu(){
  document.querySelectorAll('[data-theme-choice]').forEach(button => {
    const selected = button.getAttribute('data-theme-choice') === themePreference;
    button.setAttribute('aria-checked', selected ? 'true' : 'false');
    button.textContent = (selected ? '✓ ' : '') + button.getAttribute('data-theme-choice')[0].toUpperCase() +
      button.getAttribute('data-theme-choice').slice(1);
  });
}
function applyTheme(){
  const resolved = resolvedTheme();
  document.documentElement.dataset.theme = resolved;
  document.documentElement.style.colorScheme = resolved;
  document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#0a0a0f' : '#ffffff';
  refreshSvgTheme();
  syncThemeMenu();
  if(doc) render();   // appearance only: no commit, document save, or drawer rebuild
}
function setThemePreference(preference){
  if(!['system','light','dark'].includes(preference)) preference = 'system';
  themePreference = preference;
  try{ localStorage.setItem(THEME_KEY, preference); }catch(e){}
  applyTheme();
}
function initTheme(){
  try{
    const saved = localStorage.getItem(THEME_KEY);
    if(['system','light','dark'].includes(saved)) themePreference = saved;
  }catch(e){}
  applyTheme();
  const onSystemTheme = () => { if(themePreference === 'system') applyTheme(); };
  if(themeMedia.addEventListener) themeMedia.addEventListener('change', onSystemTheme);
  else themeMedia.addListener(onSystemTheme);
}

/* ---------------- Document model ---------------- */
function newDoc(){
  return {
    schemaVersion:1,
    mode:'canvas',
    edgeStyle:'square',          // 'square' (orthogonal) | 'curved' (cubic bezier)
    blocks:[], edges:[],
    matrix:{ xProp:'ownerTeam', yProp:'softwareStack' },
    views:{ canvas:{tx:60, ty:60, k:1}, matrix:{tx:0, ty:0, k:1}, hybrid:{tx:0, ty:0, k:1}, table:{tx:0, ty:0, k:1} },
    ui:{ panelCollapsed:false, showMeta:true, drawerOpen:false },
  };
}
/* Fill fields introduced after older saves were written */
function normalizeBlockList(blocks){
  blocks.forEach(b => {
    if(!('manHours' in b)) b.manHours = null;
    if(!('resources' in b)) b.resources = null;
  });
}
function normalizeBlocks(){ normalizeBlockList(doc.blocks); }
function cloneDocument(value){
  if(typeof structuredClone === 'function') return structuredClone(value);
  const walk = v => Array.isArray(v) ? v.map(walk)
    : (v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k,x]) => [k,walk(x)])) : v);
  return walk(value);
}
function mergeDocumentDefaults(candidate){
  const defaults = newDoc();
  const merged = Object.assign(newDoc(), candidate);
  merged.matrix = Object.assign({}, defaults.matrix, candidate.matrix || {});
  merged.views = {};
  for(const name of Object.keys(defaults.views))
    merged.views[name] = Object.assign({}, defaults.views[name], (candidate.views || {})[name] || {});
  merged.ui = Object.assign({}, defaults.ui, candidate.ui || {});
  normalizeBlockList(merged.blocks);
  return merged;
}
function templateError(name, message){ throw new Error(`${name}: ${message}`); }
function isRecord(value){ return !!value && typeof value === 'object' && !Array.isArray(value); }

/* Validate a cloned curated candidate completely before touching live state. */
function validateTemplateDocument(d, name){
  const fail = message => templateError(name, message);
  if(!isRecord(d) || d.schemaVersion !== 1) fail('schemaVersion must be 1');
  if(!Array.isArray(d.blocks) || !Array.isArray(d.edges)) fail('blocks and edges must be arrays');
  if(d.mode !== undefined && !['canvas','matrix','hybrid','table'].includes(d.mode)) fail('invalid mode');
  if(d.edgeStyle !== undefined && !['square','curved'].includes(d.edgeStyle)) fail('invalid edge style');
  if(!isRecord(d.matrix)) fail('matrix axes are required');
  const axisValid = p => AXIS_PROPS.some(([key]) => key === p);
  if(!axisValid(d.matrix.xProp) || !axisValid(d.matrix.yProp) || d.matrix.xProp === d.matrix.yProp)
    fail('matrix axes must be valid, distinct properties');

  const blockIds = new Set();
  d.blocks.forEach((b, i) => {
    const at = `block ${i + 1}${b && b.id ? ` (${b.id})` : ''}`;
    if(!isRecord(b)) fail(`${at} must be an object`);
    if(typeof b.id !== 'string' || !b.id.trim()) fail(`${at} has an empty ID`);
    if(blockIds.has(b.id)) fail(`duplicate block ID ${b.id}`);
    blockIds.add(b.id);
    if(!Object.hasOwn(BLOCK_TYPES, b.type)) fail(`${at} has invalid type ${b.type}`);
    if(typeof b.label !== 'string') fail(`${at} label must be a string`);
    if(!Number.isFinite(b.x) || !Number.isFinite(b.y)) fail(`${at} coordinates must be finite`);
    if(!Number.isFinite(b.w) || b.w <= 0 || !Number.isFinite(b.h) || b.h <= 0)
      fail(`${at} dimensions must be finite and positive`);
    for(const prop of ['ownerTeam','ownerPerson','softwareStack','scope','location'])
      if(b[prop] !== undefined && typeof b[prop] !== 'string') fail(`${at} ${prop} must be a string`);
    if(!CRITS.includes(b.criticality)) fail(`${at} has invalid criticality`);
    if(b.manHours !== undefined && b.manHours !== null &&
       (typeof b.manHours !== 'number' || !Number.isFinite(b.manHours) || b.manHours < 0))
      fail(`${at} manHours must be null or a finite number >= 0`);
    if(b.resources !== undefined && b.resources !== null &&
       (typeof b.resources !== 'number' || !Number.isFinite(b.resources) || b.resources <= 0))
      fail(`${at} resources must be null or a finite number > 0`);
  });

  const edgeIds = new Set(), connections = new Set();
  d.edges.forEach((e, i) => {
    const at = `edge ${i + 1}${e && e.id ? ` (${e.id})` : ''}`;
    if(!isRecord(e)) fail(`${at} must be an object`);
    if(typeof e.id !== 'string' || !e.id.trim()) fail(`${at} has an empty ID`);
    if(edgeIds.has(e.id)) fail(`duplicate edge ID ${e.id}`);
    edgeIds.add(e.id);
    if(!blockIds.has(e.from) || !blockIds.has(e.to)) fail(`${at} references a missing block`);
    if(e.from === e.to) fail(`${at} is a self-connection`);
    if(typeof e.label !== 'string') fail(`${at} label must be a string`);
    if(e.route !== undefined){
      if(!isRecord(e.route)) fail(`${at} route must be an object`);
      const mode=e.route.mode || 'auto';
      if(!['auto','above','below','custom'].includes(mode)) fail(`${at} has invalid route mode`);
      if(e.route.offset !== undefined && (!Number.isFinite(e.route.offset) || Math.abs(e.route.offset)>100000)) fail(`${at} has invalid route offset`);
      if(e.route.points !== undefined){
        if(!Array.isArray(e.route.points) || e.route.points.length>200) fail(`${at} has invalid route points`);
        for(const p of e.route.points) if(!isRecord(p) || !Number.isFinite(p.x) || !Number.isFinite(p.y) || Math.abs(p.x)>1000000 || Math.abs(p.y)>1000000) fail(`${at} has invalid route waypoint`);
      }
      if(mode==='custom' && !Array.isArray(e.route.points)) fail(`${at} custom route requires points`);
    }
    const key = JSON.stringify([e.from, e.to]);
    if(connections.has(key)) fail(`duplicate directed connection ${e.from} → ${e.to}`);
    connections.add(key);
  });
}
function prepareReplacement(candidate, { strict=false, name='Template' }={}){
  const cloned = cloneDocument(candidate);
  if(!isRecord(cloned) || cloned.schemaVersion !== 1 ||
     !Array.isArray(cloned.blocks) || !Array.isArray(cloned.edges))
    throw new Error(strict ? `${name}: schemaVersion must be 1 with blocks and edges arrays` : 'bad schema');
  if(strict) validateTemplateDocument(cloned, name);
  return mergeDocumentDefaults(cloned);
}
function blockById(id){ return doc.blocks.find(b => b.id === id); }
function edgeById(id){ return doc.edges.find(e => e.id === id); }
function makeBlock(type, x, y, label){
  const t = BLOCK_TYPES[type];
  return { id:uid(), type, label: label ?? t.name, x, y, w:t.w, h:t.h,
    ownerTeam:'', ownerPerson:'', softwareStack:'', criticality:'', scope:'', location:'',
    manHours:null, resources:null };
}
/* Approximate flow order: canvas x center, then y, then label (shared by hybrid + table) */
function flowOrder(){
  return [...doc.blocks].sort((a,b) =>
    (a.x + a.w/2) - (b.x + b.w/2) || (a.y - b.y) || a.label.localeCompare(b.label));
}
/* v1.2: one parser for property-panel, full-table, and drawer resource edits.
   Blank is valid null; invalid input is distinct and never reaches commit(). */
function parseResourceInput(raw){
  const text = String(raw ?? '').trim();
  if(text === '') return { ok:true, value:null };
  const value = Number(text);
  return Number.isFinite(value) && value > 0 ? { ok:true, value } : { ok:false };
}
function commitResourceEdit(b, raw, input, refreshPanel){
  const parsed = input.validity && input.validity.badInput ? { ok:false } : parseResourceInput(raw);
  if(!parsed.ok){
    input.value = b.resources ?? '';
    toast('Resources must be greater than 0.');
    return false;
  }
  input.value = parsed.value ?? '';
  if(b.resources === parsed.value) return true;
  commit();
  b.resources = parsed.value;
  afterMutation();
  if(refreshPanel) renderPanel();
  return true;
}
/* Calculated property: time to complete = manHours / resources (hours) */
function timeToComplete(b){
  const h = Number(b.manHours), r = Number(b.resources);
  if(!h || !r || r <= 0) return null;
  return h / r;
}
function fmtHours(h){
  if(h === null || h === undefined) return '—';
  const v = Math.round(h * 10) / 10;
  return v + ' h';
}
function outEdges(id){ return doc.edges.filter(e => e.from === id); }
function inEdges(id){ return doc.edges.filter(e => e.to === id); }
function precedentsOf(id){ return inEdges(id).map(e => blockById(e.from)).filter(Boolean); }
function dependentsOf(id){ return outEdges(id).map(e => blockById(e.to)).filter(Boolean); }

/* ---------------- Persistence ---------------- */
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(doc)); }catch(err){ /* storage may be unavailable */ }
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || d.schemaVersion !== 1 || !Array.isArray(d.blocks) || !Array.isArray(d.edges)) return null;
    return Object.assign(newDoc(), d);
  }catch(err){ return null; }
}

/* ---------------- Undo / redo (snapshot history, capped at 100) ---------------- */
let undoStack = [], redoStack = [];
function snapDoc(){ return JSON.stringify({ blocks:doc.blocks, edges:doc.edges, matrix:doc.matrix }); }
function commit(){
  undoStack.push(snapDoc());
  if(undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
  updateUndoBtns();
}
function applySnap(s){
  const d = JSON.parse(s);
  doc.blocks = d.blocks; doc.edges = d.edges; doc.matrix = d.matrix;
  sel.blocks.forEach(id => { if(!blockById(id)) sel.blocks.delete(id); });
  sel.edges.forEach(id => { if(!edgeById(id)) sel.edges.delete(id); });
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(snapDoc());
  applySnap(undoStack.pop());
  afterMutation(); renderPanel(); updateUndoBtns();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(snapDoc());
  applySnap(redoStack.pop());
  afterMutation(); renderPanel(); updateUndoBtns();
}
function updateUndoBtns(){
  $('#undoBtn').disabled = !undoStack.length;
  $('#redoBtn').disabled = !redoStack.length;
}

/* Called after every mutation: recompute derived visuals, render, autosave */
function afterMutation(){
  computeCycles();
  render();
  renderDrawerTable();   // v1.1: drawer rebuild lives here, never in render()
  save();
}

/* ---------------- Cycle detection (Tarjan SCC) ---------------- */
function computeCycles(){
  cycleSet = { blocks:new Set(), edges:new Set() };
  const adj = new Map(doc.blocks.map(b => [b.id, outEdges(b.id)]));
  let idx = 0; const index = new Map(), low = new Map(), onStack = new Set(), stack = [];
  function strongconnect(v){
    index.set(v, idx); low.set(v, idx); idx++;
    stack.push(v); onStack.add(v);
    for(const e of (adj.get(v) || [])){
      const w = e.to;
      if(!adj.has(w)) continue;
      if(!index.has(w)){ strongconnect(w); low.set(v, Math.min(low.get(v), low.get(w))); }
      else if(onStack.has(w)){ low.set(v, Math.min(low.get(v), index.get(w))); }
    }
    if(low.get(v) === index.get(v)){
      const scc = [];
      let w;
      do{ w = stack.pop(); onStack.delete(w); scc.push(w); }while(w !== v);
      if(scc.length > 1){
        const inScc = new Set(scc);
        scc.forEach(id => cycleSet.blocks.add(id));
        doc.edges.forEach(e => { if(inScc.has(e.from) && inScc.has(e.to)) cycleSet.edges.add(e.id); });
      }
    }
  }
  doc.blocks.forEach(b => { if(!index.has(b.id)) strongconnect(b.id); });
}

/* ---------------- Hover trace (upstream/downstream) ---------------- */
function computeTrace(id){
  const up = { blocks:new Set(), edges:new Set() };
  const down = { blocks:new Set(), edges:new Set() };
  (function walkUp(cur){
    for(const e of inEdges(cur)){
      if(up.edges.has(e.id)) continue;
      up.edges.add(e.id); up.blocks.add(e.from); walkUp(e.from);
    }
  })(id);
  (function walkDown(cur){
    for(const e of outEdges(cur)){
      if(down.edges.has(e.id)) continue;
      down.edges.add(e.id); down.blocks.add(e.to); walkDown(e.to);
    }
  })(id);
  return { up, down };
}

function el(name, attrs, parent){

function view(){ return doc.views[doc.mode]; }

function screenToWorld(px, py){

/* Block position: canvas = stored; matrix/hybrid = computed (unless being dragged) */

      return { x: gesture.mx - gesture.offMap.get(b.id).dx, y: gesture.my - gesture.offMap.get(b.id).dy };
    const L = activeLayout();
    const p = L && L.pos.get(b.id);

}

/* ---------- shape path per block type ---------- */
function shapeEl(b, parent){
  const { w, h } = b;

    case 'decision':
      n = el('polygon', { points:`${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`, ...common }, parent); break;
    case 'terminator':
      n = el('rect', { x:0, y:0, width:w, height:h, rx:h/2, ry:h/2, ...common }, parent); break;
    case 'data':{

/* ---------- main render ---------- */

  line(HEADER_COL, 0, HEADER_COL, totalH);
  line(0, HEADER_ROW, totalW, HEADER_ROW);
  colX.forEach(x => line(x, HEADER_ROW, x, totalH));
  rowY.forEach(y => line(HEADER_COL, y, totalW, y));
  line(totalW, HEADER_ROW, totalW, totalH);
  line(HEADER_COL, totalH, totalW, totalH);

function axisName(p){ const f = AXIS_PROPS.find(a => a[0] === p); return f ? f[1] : p; }

function contentBBox(pad){
  pad = pad || 60;
  if(!doc.blocks.length) return { x:0, y:0, w:800, h:600 };
  let x1=1e9, y1=1e9, x2=-1e9, y2=-1e9;
  for(const b of doc.blocks){
    const p = blockPos(b);
    x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
    x2 = Math.max(x2, p.x + b.w); y2 = Math.max(y2, p.y + b.h);
  }
  const L = activeLayout();
  if(L){
    x2 = Math.max(x2, L.totalW); y2 = Math.max(y2, L.totalH);
    x1 = Math.min(x1, 0); y1 = Math.min(y1, 0);
  }
  return { x:x1 - pad, y:y1 - pad, w:(x2 - x1) + pad*2, h:(y2 - y1) + pad*2 };

/* ---------- matrix layout ---------- */
function blockAxisVal(b, prop){
  if(prop === 'type') return BLOCK_TYPES[b.type].name;
  return (b[prop] || '').toString().trim();
}
function computeMatrixLayout(){
  const { xProp, yProp } = doc.matrix;
  const xv = new Map(), yv = new Map();  // value → blocks
  for(const b of doc.blocks){
    const x = blockAxisVal(b, xProp), y = blockAxisVal(b, yProp);
    if(!xv.has(x)) xv.set(x, []); xv.get(x).push(b);
    if(!yv.has(y)) yv.set(y, []); yv.get(y).push(b);
  }
  const sortKeys = m => [...m.keys()].filter(k => k !== '').sort((a,b) => a.localeCompare(b))
    .concat(m.has('') ? [''] : []);
  const cols = sortKeys(xv).map(v => ({ val:v, label: v === '' ? 'Unassigned' : v }));
  const rows = sortKeys(yv).map(v => ({ val:v, label: v === '' ? 'Unassigned' : v }));

  const colX = []; let cx = HEADER_COL;
  cols.forEach(() => { colX.push(cx); cx += CELL_W; });
  const rowH = [], rowY = []; let ry = HEADER_ROW;
  const pos = new Map();
  rows.forEach(r => {
    // row height = max stacked content across its cells
    let need = CELL_H;
    cols.forEach(c => {
      const cellBlocks = doc.blocks.filter(b => blockAxisVal(b, xProp) === c.val && blockAxisVal(b, yProp) === r.val);
      const h = cellBlocks.reduce((s,b) => s + b.h + CELL_GAP, CELL_PAD*2);
      need = Math.max(need, h);
    });
    rowH.push(need); rowY.push(ry); ry += need;
  });
  cols.forEach((c, ci) => {
    rows.forEach((r, ri) => {
      const cellBlocks = doc.blocks
        .filter(b => blockAxisVal(b, xProp) === c.val && blockAxisVal(b, yProp) === r.val)
        .sort((a,b) => a.label.localeCompare(b.label));
      let y = rowY[ri] + CELL_PAD;
      for(const b of cellBlocks){
        pos.set(b.id, { x: colX[ci] + (CELL_W - b.w)/2, y });
        y += b.h + CELL_GAP;
      }
    });
  });
  matrixLayout = { xProp, yProp, cols, rows, colX, colW: cols.map(() => CELL_W), rowY, rowH, pos,
    totalW: cx, totalH: ry };
}

/* ---------- hybrid layout ----------
   Y = strict lanes (like matrix rows).
   X = column bands labelled by the X property, following the canvas flow order
   (blocks sorted by canvas x). Each activity gets its own band, so labels may
   repeat along the flow (e.g. Sales | Operations | Sales | Procurement) and
   every band holds only blocks whose X value matches — keeping connections
   forward-flowing and the diagram unconvoluted. */
function computeHybridLayout(){
  const { xProp, yProp } = doc.matrix;
  // Y lanes: distinct values, alphabetical, Unassigned last
  const yVals = new Map();
  for(const b of doc.blocks){
    const y = blockAxisVal(b, yProp);
    if(!yVals.has(y)) yVals.set(y, []);
    yVals.get(y).push(b);
  }
  const laneKeys = [...yVals.keys()].filter(k => k !== '').sort((a,b) => a.localeCompare(b))
    .concat(yVals.has('') ? [''] : []);
  const rows = laneKeys.map(v => ({ val:v, label: v === '' ? 'Unassigned' : v }));

  // X segments from canvas flow order (x center, then y, then label).
  // Every activity gets its OWN band — the same label repeats along the flow
  // rather than merging, so connections always run forward left→right.
  const ordered = [...doc.blocks].sort((a,b) =>
    (a.x + a.w/2) - (b.x + b.w/2) || (a.y - b.y) || a.label.localeCompare(b.label));
  const cols = ordered.map(b => {
    const v = blockAxisVal(b, xProp);
    return { val:v, label: v === '' ? 'Unassigned' : v, blocks:[b] };
  });

  // segment widths: max block width + padding, min 200
  const colW = cols.map(c => Math.max(200, ...c.blocks.map(b => b.w + CELL_PAD*2)));
  const colX = []; let cx = HEADER_COL;
  colW.forEach(w => { colX.push(cx); cx += w; });

  // lane heights: max stacked content across segments, min CELL_H
  const rowH = [], rowY = []; let ry = HEADER_ROW;
  rows.forEach(r => {
    let need = CELL_H;
    cols.forEach(c => {
      const cellBlocks = c.blocks.filter(b => blockAxisVal(b, yProp) === r.val);
      const h = cellBlocks.reduce((s,b) => s + b.h + CELL_GAP, CELL_PAD*2);
      need = Math.max(need, h);
    });
    rowH.push(need); rowY.push(ry); ry += need;
  });

  // stack blocks within (segment, lane), ordered by canvas y to respect the flow
  const pos = new Map();
  cols.forEach((c, ci) => {
    rows.forEach((r, ri) => {
      const cellBlocks = c.blocks
        .filter(b => blockAxisVal(b, yProp) === r.val)
        .sort((a,b) => (a.y - b.y) || a.label.localeCompare(b.label));
      let y = rowY[ri] + CELL_PAD;
      for(const b of cellBlocks){
        pos.set(b.id, { x: colX[ci] + (colW[ci] - b.w)/2, y });
        y += b.h + CELL_GAP;
      }
    });
  });
  hybridLayout = { xProp, yProp, cols, rows, colX, colW, rowY, rowH, pos,
    totalW: cx, totalH: ry };
}
function cellAt(wx, wy){
  const L = activeLayout();
  if(!L) return null;
  const ci = L.colX.findIndex((x, i) => wx >= x && wx < x + L.colW[i]);
  const ri = L.rowY.findIndex((y, i) => wy >= y && wy < y + L.rowH[i]);
  if(ci < 0 || ri < 0) return null;
  return { ci, ri };
}

/* ---------- edges ---------- */
/* Orthogonal path with rounded corners through a list of points */
function orthPath(pts, r){
  r = r ?? 8;
  let d = `M${pts[0].x},${pts[0].y}`;
  for(let i = 1; i < pts.length; i++){
    const p = pts[i];
    if(i === pts.length - 1){ d += ` L${p.x},${p.y}`; break; }
    const prev = pts[i-1], next = pts[i+1];
    const d1 = Math.hypot(p.x - prev.x, p.y - prev.y);
    const d2 = Math.hypot(next.x - p.x, next.y - p.y);
    const rr = Math.min(r, d1/2, d2/2);
    const inX  = p.x + Math.sign(prev.x - p.x) * rr,  inY  = p.y + Math.sign(prev.y - p.y) * rr;
    const outX = p.x + Math.sign(next.x - p.x) * rr,  outY = p.y + Math.sign(next.y - p.y) * rr;
    d += ` L${inX},${inY} Q${p.x},${p.y} ${outX},${outY}`;
  }
  return d;
}
/* Edge geometry for both styles. Returns { d, mid } — mid is used for the

function edgeGeomFromPoints(p1, p2){

    const dx = Math.max(40, Math.abs(p2.x - p1.x) / 2);
    return {
      d: `M${p1.x},${p1.y} C${p1.x + dx},${p1.y} ${p2.x - dx},${p2.y} ${p2.x},${p2.y}`,
      mid: { x:(p1.x + 3*(p1.x+dx) + 3*(p2.x-dx) + p2.x) / 8, y:(p1.y + 3*p1.y + 3*p2.y + p2.y) / 8 },
    };
  }
  // square (orthogonal, default)
  const stub = 20;
  if(p2.x - p1.x >= 24){
    // target ahead: out → mid vertical → in
    const mx = (p1.x + p2.x) / 2;
    return {
      d: orthPath([p1, {x:mx, y:p1.y}, {x:mx, y:p2.y}, p2]),
      mid: { x:mx, y:(p1.y + p2.y)/2 },
    };
  }
  // target behind or too close: route around (above or below, away from target)
  const bypassY = p2.y >= p1.y
    ? Math.max(p1.y, p2.y) + 44
    : Math.min(p1.y, p2.y) - 44;
  return {
    d: orthPath([p1, {x:p1.x + stub, y:p1.y}, {x:p1.x + stub, y:bypassY},
                 {x:p2.x - stub, y:bypassY}, {x:p2.x - stub, y:p2.y}, p2]),
    mid: { x:(p1.x + stub + p2.x - stub)/2, y:bypassY },

      mid = { x:pts[i].x+(pts[i+1].x-pts[i].x)*t, y:pts[i].y+(pts[i+1].y-pts[i].y)*t };

      // interior of its own source or target is still a block collision.
      if((r.id===route.from && i===0) || (r.id===route.to && i===route.segments.length-1)) continue;

function routeIntersections(a,b){

  for(const s of a.segments) for(const t of b.segments){
    if(s.horizontal===t.horizontal) continue; // Collinear overlap intentionally merges.
    const h=s.horizontal?s:t, v=s.horizontal?t:s;
    const x=v.a.x, y=h.a.y;
    if(x<h.minX-ROUTE_EPS || x>h.maxX+ROUTE_EPS || y<v.minY-ROUTE_EPS || y>v.maxY+ROUTE_EPS) continue;
    if(shared.some(p => Math.abs(p.x-x)<ROUTE_EPS && Math.abs(p.y-y)<ROUTE_EPS)) continue;

let routingPairCache = null;

function routeScore(route, obstacles, others){

}
function edgeRoutePrefs(e){

function effectiveEdgeRoutePrefs(e){
  const pref=edgeRoutePrefs(e);

  // derive fresh automatic geometry without deleting the saved Canvas route.
  if(doc.mode!=='canvas' && pref.mode==='custom') return {mode:'auto',offset:0,points:[]};
  return pref;
}
function customSquareRoute(e,p1,p2){
  const pref=edgeRoutePrefs(e), points=pref.points.map(p=>({x:p.x,y:p.y}));
  if(points.length){
    // Reattach horizontal leads after either endpoint moves. Interior channel
    // waypoints stay exactly where the user placed them.
    points[0].y=p1.y;
    points[points.length-1].y=p2.y;
  }

}
function squareRouteCandidates(e,p1,p2,obstacles){
  const pref=effectiveEdgeRoutePrefs(e);
  if(pref.mode==='custom'){
    const custom=customSquareRoute(e,p1,p2);
    return custom ? [custom] : [];
  }
  const candidates = [], seen=new Set();
  const add = points => {
    const route = routeGeometry(points);
    if(!route) return;
    const signature=route.points.map(p=>`${Math.round(p.x*100)},${Math.round(p.y*100)}`).join(';');
    if(seen.has(signature)) return;
    seen.add(signature);
    candidates.push({ ...route, id:e.id, from:e.from, to:e.to, key:`${e.id}:${candidates.length}` });
  };
  if(pref.mode==='auto' && p2.x-p1.x >= 24){
    for(const t of [.25,.5,.75]){
      const mx=p1.x+(p2.x-p1.x)*t;
      add([p1,{x:mx,y:p1.y},{x:mx,y:p2.y},p2]);
    }
  }
  const stub=20, sx=p1.x+stub, tx=p2.x-stub;
  const minX=Math.min(p1.x,p2.x,sx,tx), maxX=Math.max(p1.x,p2.x,sx,tx);
  const centerX=(minX+maxX)/2, centerY=(p1.y+p2.y)/2, dense=doc.edges.length>100;
  const relevant=obstacles.filter(r => r.id!==e.from && r.id!==e.to &&
    r.x+r.w>minX && r.x<maxX).sort((a,b)=>{
      const da=Math.abs((a.x+a.w/2)-centerX)+Math.abs((a.y+a.h/2)-centerY);
      const db=Math.abs((b.x+b.w/2)-centerX)+Math.abs((b.y+b.h/2)-centerY);
      return da-db || a.id.localeCompare(b.id);

}
function bestSquareRoute(candidates,obstacles,others){

    const score=routeScore(route,obstacles,others);
    if(score<bestScore-ROUTE_EPS){ best=route; bestScore=score; }
  }
  return best;
}
function wholeGraphScore(routes,obstacles){
  let score=0;

    if(route.blockHits===undefined) route.blockHits=routeBlockHits(route,obstacles);
    score += route.blockHits*1000000 + Math.max(0,route.points.length-2)*40 + route.length*.02;
  }
  for(let i=0;i<routes.length;i++) for(let j=i+1;j<routes.length;j++)
    score += cachedRouteIntersections(routes[i],routes[j])*5000;
  return score;
}
function optimizeRouteOrder(entries,obstacles){
  const result=new Map(), automatic=entries.filter(x=>effectiveEdgeRoutePrefs(x.e).mode!=='custom');
  for(const entry of entries) if(effectiveEdgeRoutePrefs(entry.e).mode==='custom' && entry.candidates[0])
    result.set(entry.e.id,entry.candidates[0]);
  for(const entry of automatic){
    const route=bestSquareRoute(entry.candidates,obstacles,[...result.values()]);
    if(route) result.set(entry.e.id,route);
  }
  let score=wholeGraphScore([...result.values()],obstacles);
  // Bounded coordinate descent: stop as soon as a complete pass cannot improve
  // the whole graph. Four passes is a strict cap, not a target.
  const passCap=entries.length>100?1:4;
  for(let pass=0;pass<passCap;pass++){
    let improved=false;
    for(const entry of automatic){
      const current=result.get(entry.e.id);
      const others=[...result.values()].filter(r=>r.id!==entry.e.id);
      const route=bestSquareRoute(entry.candidates,obstacles,others);
      if(!route) continue;
      // With all other routes fixed, the local score delta is exactly the
      // whole-graph delta; avoid an O(E²) graph rescore for every candidate.
      const currentScore=current?routeScore(current,obstacles,others):Infinity;
      if(routeScore(route,obstacles,others)<currentScore-ROUTE_EPS){
        result.set(entry.e.id,route); improved=true;

  return {result,score:wholeGraphScore([...result.values()],obstacles)};
}
function computeEdgeRoutes(){
  // Pan/zoom, selection, labels, and theme changes reuse geometry. Positions,
  // route overrides, endpoints, and style are the actual routing inputs.
  if(gesture && gesture.type==='routedrag'){
    const e=edgeById(gesture.id), a=e&&blockById(e.from), b=e&&blockById(e.to);
    if(a&&b){ const route=customSquareRoute(e,leadOut(a),leadIn(b)); if(route) edgeRouteCache.set(e.id,route); }
    return;
  }
  const signature=doc.edgeStyle+'|'+doc.mode+'|drag:'+Number(!!(gesture && gesture.type==='blockdrag'))+'|'+
    doc.blocks.map(b => { const p=blockPos(b); return `${b.id}:${p.x},${p.y},${b.w},${b.h}`; }).join('|')+'|'+
    doc.edges.map(e => `${e.id}:${e.from}>${e.to}:${JSON.stringify(e.route||null)}`).join('|');
  if(signature===edgeRouteSignature) return;
  edgeRouteSignature=signature;
  edgeRouteCache=new Map();
  if(doc.edgeStyle==='curved') return;
  const obstacles=doc.blocks.map(b => {
    const p=blockPos(b); return {id:b.id,x:p.x-6,y:p.y-6,w:b.w+12,h:b.h+12};
  });
  const entries=[];
  doc.edges.forEach((e,index) => {
    const a=blockById(e.from), b=blockById(e.to); if(!a||!b) return;
    const p1=leadOut(a), p2=leadIn(b);
    entries.push({e,index,p1,p2,backward:p2.x<p1.x,span:Math.abs(p2.x-p1.x)+Math.abs(p2.y-p1.y),
      candidates:squareRouteCandidates(e,p1,p2,obstacles)});

  const backwardFirst=(a,b)=>Number(b.backward)-Number(a.backward)||b.span-a.span||a.index-b.index;
  const orders=[
    [...entries].sort(backwardFirst),
    [...entries].sort((a,b)=>Number(a.backward)-Number(b.backward)||b.span-a.span||a.index-b.index),
    [...entries].sort((a,b)=>a.index-b.index),
    [...entries].sort((a,b)=>b.index-a.index),

      if(route) edgeRouteCache.set(entry.e.id,route);
    }

  }
  routingPairCache=new Map();
  let best=null;
  for(const ordered of orders){
    const optimized=optimizeRouteOrder(ordered,obstacles);

}
function edgeGeom(e){
  const a = blockById(e.from), b = blockById(e.to);
  if(!a || !b) return { d:'', mid:{x:0, y:0} };
  if(doc.edgeStyle==='square' && edgeRouteCache.has(e.id)) return edgeRouteCache.get(e.id);

}
function edgePath(e){ return edgeGeom(e).d; }
function edgeMidpoint(e){ return edgeGeom(e).mid; }
function renderEdge(e){
  const g = el('g', { class:'edge', 'data-id':e.id }, gEdges);
  let stroke = themeColor('muted'), marker = 'norm', width = 1.5;
  const isCycle = cycleSet.edges.has(e.id);
  const isSel = sel.edges.has(e.id);
  let dim = false;
  if(trace && hoverId){
    if(trace.up.edges.has(e.id)){ stroke = themeColor('up'); marker = 'up'; width = 2.2; }
    else if(trace.down.edges.has(e.id)){ stroke = themeColor('down'); marker = 'down'; width = 2.2; }
    else dim = true;
  } else if(isCycle){ stroke = themeColor('warn'); marker = 'warn'; }

  const d = edgePath(e);

  el('path', { d, fill:'none', stroke:'transparent', 'stroke-width':14, 'pointer-events':'stroke' }, g);
  el('path', { d, fill:'none', stroke, 'stroke-width':width, 'marker-end':`url(#arr-${marker})` }, g);

    const route=edgeGeom(e), custom=effectiveEdgeRoutePrefs(e).mode==='custom';
    if(route.segments) route.segments.forEach((seg,i)=>{
      if(i===0 || i===route.segments.length-1) return;
      const handle=el('path',{d:`M${seg.a.x},${seg.a.y} L${seg.b.x},${seg.b.y}`,fill:'none',
        stroke:'transparent','stroke-width':20,'pointer-events':'stroke',class:'route-segment',
        'data-id':e.id,'data-index':i,cursor:seg.horizontal?'ns-resize':'ew-resize'},g);
      const title=el('title',null,handle); title.textContent=seg.horizontal?'Drag vertically to customize route':'Drag horizontally to customize route';
    });

      el('circle',{cx:p.x,cy:p.y,r:3.5,fill:themeColor('surface'),stroke:themeColor('accent'),'stroke-width':1.5,'pointer-events':'none'},g));
  }

  if(isCycle){ const t = el('title', null, g); t.textContent = 'Part of a loop.'; }

      fill:themeColor('surface'), stroke:themeColor('border') }, bg);
    const t = el('text', { x:mid.x, y:mid.y - 4, 'text-anchor':'middle', 'font-size':11, fill:themeColor('muted') }, bg);

    if(dim) bg.classList.add('dim');
  }

    const dg = el('g', { class:'edge-x', 'data-id':e.id, cursor:'pointer' }, g);
    el('circle', { cx:mid.x, cy:mid.y + (e.label ? 14 : 0), r:8, fill:themeColor('surface'), stroke:themeColor('accent'), 'stroke-width':1.5 }, dg);
    const t = el('text', { x:mid.x, y:mid.y + (e.label ? 18 : 4), 'text-anchor':'middle',
      'font-size':12, fill:themeColor('accent'), 'pointer-events':'none' }, dg);

/* ---------- blocks ---------- */
/* Metadata badges beneath the block label (v1.1 — canvas mode only; in
   Matrix/Hybrid the axis headers already convey these values). Line 1 = owner
   team, line 2 = software stack; blocks shorter than 70px get ONE combined
   line so nothing clips (smallest shape: terminator, h=56). */
function badgeLines(b){
  if(doc.mode !== 'canvas' || !doc.ui.showMeta) return [];
  const team = (b.ownerTeam || '').trim(), stack = (b.softwareStack || '').trim();
  if(!team && !stack) return [];
  if(b.h < 70) return [team && stack ? team + ' · ' + stack : team || stack];
  return [team, stack].filter(Boolean);
}
/* baseline offsets vs b.h/2: label sits centered (+4.5) without badges and
   shifts up to make room when badges are present */
function badgeLayout(n){
  return n === 0 ? { label:4.5, lines:[] }
       : n === 1 ? { label:-3, lines:[11] }
                 : { label:-9, lines:[4, 16] };
}

function renderLoopMarker(b, parent){
  const x = b.type === 'decision' ? b.w/2 : b.w - 15;
  const y = b.type === 'decision' ? 11 : 13;
  const g = el('g', { class:'loop-marker', transform:`translate(${x},${y})`, 'pointer-events':'none' }, parent);
  const common = { fill:'none', stroke:themeColor('warn'), 'stroke-width':1.4, 'stroke-linecap':'round', 'stroke-linejoin':'round' };
  el('path', { d:'M-4 -1 A4.5 4.5 0 1 1 -2 4', ...common }, g);
  el('path', { d:'M-4 -5 L-4 -1 L0 -1', ...common }, g);
}

function renderBlock(b){
  const p = blockPos(b);
  const g = el('g', { class:'block', 'data-id':b.id, transform:`translate(${p.x},${p.y})` }, gBlocks);

  const shape = shapeEl(b, g);
  const isSel = sel.blocks.has(b.id);
  const isCycle = cycleSet.blocks.has(b.id);

  shape.setAttribute('fill', themeColor(isCycle ? 'loopFill' : 'block'));
  let stroke = themeColor(CRIT_THEME_KEYS[b.criticality] || 'border');
  let sw = b.criticality ? 2.5 : 1;
  if(trace && hoverId){
    if(trace.up.blocks.has(b.id)){ stroke = themeColor('up'); sw = 2.5; }
    else if(trace.down.blocks.has(b.id)){ stroke = themeColor('down'); sw = 2.5; }
    else if(b.id !== hoverId) g.classList.add('dim');
  }
  if(isSel){
    // Selection stays outermost, so criticality and tracing remain readable.
    g.setAttribute('filter','url(#selShadow)');
    el('rect', { x:-4.5, y:-4.5, width:b.w+9, height:b.h+9, rx:8, ry:8,
      fill:'none', stroke:themeColor('accent'), 'stroke-width':2, 'pointer-events':'none' }, g);
  }
  shape.setAttribute('stroke', stroke);
  shape.setAttribute('stroke-width', sw);

  if(isCycle){
    const title = el('title', null, g);
    title.textContent = 'Part of a loop.';
    renderLoopMarker(b, g);
  }

  // label + metadata badges
  const badges = badgeLines(b);
  const bl = badgeLayout(badges.length);
  const t = el('text', { x:b.w/2, y:b.h/2 + bl.label, 'text-anchor':'middle', 'font-size':13,
    fill:themeColor('text'), 'pointer-events':'none' }, g);
  t.textContent = truncate(b.label || '(untitled)', b.w - 22);
  badges.forEach((s, i) => {
    const bt = el('text', { x:b.w/2, y:b.h/2 + bl.lines[i], 'text-anchor':'middle', 'font-size':10,
      fill:themeColor('muted'), 'pointer-events':'none' }, g);
    bt.textContent = truncate(s, b.w - 16, 5.5);
  });

  // leads
  el('circle', { class:'lead lead-in',  'data-id':b.id, cx:0,    cy:b.h/2, r:5.5 }, g);
  el('circle', { class:'lead lead-out', 'data-id':b.id, cx:b.w,  cy:b.h/2, r:5.5 }, g);
}

/* ---------- overlay: pending connection, marquee, guides ---------- */
function renderOverlay(){
  gOverlay.innerHTML = '';
  if(gesture && gesture.type === 'connect'){
    const a = blockById(gesture.fromId);
    if(a){
      const g2 = edgeGeomFromPoints(leadOut(a), { x:gesture.mx, y:gesture.my });
      el('path', { d:g2.d, fill:'none', stroke:themeColor('accent'), 'stroke-width':1.5, 'stroke-dasharray':'5 4',
        'marker-end':'url(#arr-sel)' }, gOverlay);
    }
  }
  if(gesture && gesture.type === 'marquee'){
    const { x0,y0,mx,my } = gesture;
    el('rect', { x:Math.min(x0,mx), y:Math.min(y0,my), width:Math.abs(mx-x0), height:Math.abs(my-y0),
      fill:themeColor('ghostFill'), stroke:themeColor('accent'), 'stroke-width':1, 'stroke-dasharray':'4 3' }, gOverlay);
  }
  if(gesture && gesture.type === 'blockdrag' && gesture.guides){
    for(const gd of gesture.guides){
      if(gd.axis === 'v')
        el('line', { x1:gd.at, y1:gd.from, x2:gd.at, y2:gd.to, stroke:themeColor('guide'), 'stroke-width':1, 'stroke-dasharray':'3 3' }, gOverlay);
      else
        el('line', { x1:gd.from, y1:gd.at, x2:gd.to, y2:gd.at, stroke:themeColor('guide'), 'stroke-width':1, 'stroke-dasharray':'3 3' }, gOverlay);
    }
  }
}

/* ============================================================
   Table view — activities in approximate flow order, properties
   as editable fields. Time to complete is computed (read-only).
   ============================================================ */
/* One builder, two containers: #tableWrap gets every column, the v1.1 drawer
   gets the abridged set (Type/Owner person/Location/Scope/Precedents/
   Dependents stay exclusive to full Table mode). */
const TABLE_COLS = [
  ['num','#'], ['label','Label'], ['type','Type'], ['ownerTeam','Owner team'],
  ['ownerPerson','Owner person'], ['softwareStack','Software stack'], ['criticality','Criticality'],
  ['location','Location'], ['scope','Scope'], ['manHours','Man-hours'], ['resources','Resources'],
  ['ttc','Time to complete'], ['pre','Precedents'], ['dep','Dependents'],
];
const DRAWER_COLS = ['num','label','ownerTeam','softwareStack','criticality','manHours','resources','ttc'];
const NUM_COLS = new Set(['num','manHours','resources','ttc']);

function buildTableHTML(abridged){
  const rows = flowOrder();
  const teamOpts = enumOptions('ownerTeam'), stackOpts = enumOptions('softwareStack');
  const relList = arr => arr.map(x => esc(x.label)).join(', ') || '—';
  const HEAD = Object.fromEntries(TABLE_COLS);
  const cols = abridged ? DRAWER_COLS : TABLE_COLS.map(c => c[0]);
  let html = `<table class="grid"><thead><tr>` +
    cols.map(c => `<th${NUM_COLS.has(c) ? ' class="num"' : ''}>${HEAD[c]}</th>`).join('') +
    `</tr></thead><tbody>`;
  rows.forEach((b, i) => {
    const cell = {
      num: `<td class="ord">${i + 1}</td>`,
      label: `<td><input type="text" data-prop="label" value="${esc(b.label)}"></td>`,
      type: `<td>${BLOCK_TYPES[b.type].name}</td>`,
      ownerTeam: `<td><select data-prop="ownerTeam">${enumHtml(teamOpts, b.ownerTeam)}</select></td>`,
      ownerPerson: `<td><input type="text" data-prop="ownerPerson" value="${esc(b.ownerPerson)}"></td>`,
      softwareStack: `<td><select data-prop="softwareStack">${enumHtml(stackOpts, b.softwareStack)}</select></td>`,
      criticality: `<td><select data-prop="criticality">${CRITS.map(c => `<option value="${c}" ${c === b.criticality ? 'selected' : ''}>${c || '— unset —'}</option>`).join('')}</select></td>`,
      location: `<td><input type="text" data-prop="location" value="${esc(b.location)}"></td>`,
      scope: `<td><input type="text" data-prop="scope" value="${esc(b.scope)}"></td>`,
      manHours: `<td class="num"><input type="number" data-prop="manHours" min="0" step="0.5" value="${b.manHours ?? ''}"></td>`,
      resources: `<td class="num"><input type="number" data-prop="resources" step="any" title="Decimals supported" value="${b.resources ?? ''}"></td>`,
      ttc: `<td class="num ttc">${fmtHours(timeToComplete(b))}</td>`,
      pre: `<td class="rel" title="${esc(relList(precedentsOf(b.id)))}">${esc(relList(precedentsOf(b.id)))}</td>`,
      dep: `<td class="rel" title="${esc(relList(dependentsOf(b.id)))}">${esc(relList(dependentsOf(b.id)))}</td>`,
    };
    const inCycle = cycleSet.blocks.has(b.id);
    html += `<tr data-id="${b.id}" class="${sel.blocks.has(b.id) ? 'sel' : ''} ${inCycle ? 'in-cycle' : ''}"
      ${inCycle ? 'title="Part of a loop."' : ''}>` + cols.map(c => cell[c]).join('') + `</tr>`;
  });
  return html + `</tbody></table>`;
}
function renderTable(){ $('#tableWrap').innerHTML = buildTableHTML(false); }

/* v1.1 — drawer table is rebuilt ONLY here and from applyDrawer (open/mode
   change), both driven by afterMutation — never from render(), which fires on
   every wheel-zoom tick. Selection highlight syncs via class toggles only. */
function renderDrawerTable(){
  if(doc.mode === 'table' || !doc.ui.drawerOpen) return;
  $('#drawerBody').innerHTML = buildTableHTML(true);
}
function syncTableSel(){
  document.querySelectorAll('#drawerBody tr[data-id]').forEach(tr =>
    tr.classList.toggle('sel', sel.blocks.has(tr.getAttribute('data-id'))));

// cell edits (delegated — fires on 'change', i.e. after editing is done)
function onGridChange(ev){

  if(!tr || !t.dataset.prop) return;

    return;

    return;
  }

  else b[prop] = t.value.trim();

// row selection (clicking outside of editors)
function onGridClick(ev){

// one code path, two containers (full Table view + v1.1 drawer)
for(const c of [$('#tableWrap'), $('#drawerBody')]){

}

/* ============================================================
   Interactions
   ============================================================ */

/* ---------- selection ---------- */
function clearSel(){ sel.blocks.clear(); sel.edges.clear(); renderPanel(); }
function selectOnly(kind, id){
  sel.blocks.clear(); sel.edges.clear();
  if(kind === 'block') sel.blocks.add(id); else sel.edges.add(id);
  renderPanel();
}
function deleteSelected(){
  if(!sel.blocks.size && !sel.edges.size) return;
  commit();
  doc.edges = doc.edges.filter(e => !sel.edges.has(e.id) && !sel.blocks.has(e.from) && !sel.blocks.has(e.to));
  doc.blocks = doc.blocks.filter(b => !sel.blocks.has(b.id));
  sel.blocks.clear(); sel.edges.clear();
  hoverId = null; trace = null;
  afterMutation(); renderPanel();
}
function duplicateSelected(){
  if(!sel.blocks.size) return;
  commit();
  const map = new Map(); const newIds = [];
  for(const id of sel.blocks){
    const b = blockById(id); if(!b) continue;
    const nb = JSON.parse(JSON.stringify(b));
    nb.id = uid(); nb.x += 20; nb.y += 20;
    map.set(id, nb.id); doc.blocks.push(nb); newIds.push(nb.id);
  }
  for(const e of [...doc.edges]){
    if(map.has(e.from) && map.has(e.to))
      doc.edges.push({ id:uid(), from:map.get(e.from), to:map.get(e.to), label:e.label });
  }
  sel.blocks = new Set(newIds); sel.edges.clear();
  afterMutation(); renderPanel();
  toast('Block duplicated');
}

/* ---------- edge creation guardrails ---------- */
function tryConnect(fromId, toId){
  if(fromId === toId){ toast('Self-connections are not allowed'); return; }
  if(doc.edges.some(e => e.from === fromId && e.to === toId)){ toast('Connection already exists'); return; }
  commit();
  doc.edges.push({ id:uid(), from:fromId, to:toId, label:'' });
  afterMutation();
}

/* ---------- pointer handling ---------- */
function evPos(ev){ return screenToWorld(ev.clientX, ev.clientY); }
function hitBlock(ev){
  const n = ev.target.closest && ev.target.closest('.block');
  return n ? n.getAttribute('data-id') : null;
}
function hitEdge(ev){
  const n = ev.target.closest && ev.target.closest('.edge');
  return n ? n.getAttribute('data-id') : null;
}

svg.addEventListener('pointerdown', ev => {
  svg.focus();
  hideLeadPop();
  const w = evPos(ev);

  // pan: middle button or space+drag
  if(ev.button === 1 || (spaceDown && ev.button === 0)){
    gesture = { type:'pan', sx:ev.clientX, sy:ev.clientY, tx:view().tx, ty:view().ty };
    svg.classList.add('panning'); ev.preventDefault(); return;
  }
  if(ev.button !== 0) return;

  // lead: start connection (output) or open list (either)
  const lead = ev.target.closest && ev.target.closest('.lead');
  if(lead){
    const id = lead.getAttribute('data-id');
    if(lead.classList.contains('lead-out')){
      gesture = { type:'connect', fromId:id, mx:w.x, my:w.y, moved:false };
      svg.classList.add('connecting');
    } else {
      openLeadPop(id, 'in', ev.clientX, ev.clientY);
    }
    ev.preventDefault(); return;
  }

  // selected Square route segment: drag a middle channel, never a fixed lead
  const segment = ev.target.closest && ev.target.closest('.route-segment');
  if(segment){
    const id=segment.getAttribute('data-id'), e=edgeById(id), route=e&&edgeGeom(e);
    if(e && route && route.points){
      selectOnly('edge',id);
      const pref=edgeRoutePrefs(e);
      gesture={type:'routedrag',id,index:Number(segment.getAttribute('data-index')),
        startX:w.x,startY:w.y,moved:false,undo:snapDoc(),originalRoute:cloneDocument(e.route||null),
        orig:route.points.slice(1,-1).map(p=>({x:p.x,y:p.y})),horizontal:route.segments[Number(segment.getAttribute('data-index'))].horizontal};
      e.route={mode:'custom',offset:0,points:cloneDocument(gesture.orig)};
      ev.preventDefault(); return;
    }
  }

  // edge delete × at midpoint
  const ex = ev.target.closest && ev.target.closest('.edge-x');
  if(ex){
    commit();
    doc.edges = doc.edges.filter(e => e.id !== ex.getAttribute('data-id'));
    sel.edges.delete(ex.getAttribute('data-id'));
    afterMutation(); renderPanel(); return;
  }

  // block: select + maybe drag
  const bid = hitBlock(ev);
  if(bid){
    if(ev.shiftKey){
      sel.blocks.has(bid) ? sel.blocks.delete(bid) : sel.blocks.add(bid);
      sel.edges.clear(); renderPanel(); render(); return;
    }
    if(!sel.blocks.has(bid)){ selectOnly('block', bid); }
    // prepare drag (selection may include several blocks)
    const ids = [...sel.blocks];
    const offMap = new Map();
    for(const id of ids){
      const b = blockById(id); const p = blockPos(b);
      offMap.set(id, { dx: w.x - p.x, dy: w.y - p.y });
    }
    gesture = { type:'blockdrag', ids, matrixIds:new Set(ids), offMap, mx:w.x, my:w.y,
      startX:w.x, startY:w.y, moved:false, guides:null, hoverCell:null,
      orig: new Map(ids.map(id => { const b = blockById(id); return [id, {x:b.x, y:b.y}]; })) };
    ev.preventDefault(); return;
  }

  // edge: select
  const eid = hitEdge(ev);
  if(eid){
    if(ev.shiftKey){ sel.edges.has(eid) ? sel.edges.delete(eid) : sel.edges.add(eid); }
    else selectOnly('edge', eid);
    render(); return;
  }

  // empty canvas: marquee (left button)
  if(!ev.shiftKey) clearSel();
  gesture = { type:'marquee', x0:w.x, y0:w.y, mx:w.x, my:w.y, additive:ev.shiftKey };
  render();
});

window.addEventListener('pointermove', ev => {
  if(!gesture) return;
  const w = evPos(ev);

  if(gesture.type === 'pan'){
    view().tx = gesture.tx + (ev.clientX - gesture.sx);
    view().ty = gesture.ty + (ev.clientY - gesture.sy);
    render(); return;
  }
  if(gesture.type === 'connect'){
    gesture.mx = w.x; gesture.my = w.y; gesture.moved = true;
    renderOverlay(); return;
  }
  if(gesture.type === 'routedrag'){
    const delta=gesture.horizontal ? w.y-gesture.startY : w.x-gesture.startX;
    if(Math.abs(delta)>2) gesture.moved=true;
    if(!gesture.moved) return;
    const e=edgeById(gesture.id); if(!e) return;
    const snapped=Math.round(delta/SNAP)*SNAP;
    const points=cloneDocument(gesture.orig), i=gesture.index-1;
    if(points[i] && points[i+1]){
      if(gesture.horizontal){ points[i].y+=snapped; points[i+1].y+=snapped; }
      else { points[i].x+=snapped; points[i+1].x+=snapped; }
    }
    e.route={mode:'custom',offset:0,points};
    render(); return;
  }
  if(gesture.type === 'marquee'){
    gesture.mx = w.x; gesture.my = w.y;
    const x1 = Math.min(gesture.x0,w.x), x2 = Math.max(gesture.x0,w.x);
    const y1 = Math.min(gesture.y0,w.y), y2 = Math.max(gesture.y0,w.y);
    if(!gesture.additive) sel.blocks.clear();
    for(const b of doc.blocks){
      const p = blockPos(b);
      if(p.x < x2 && p.x + b.w > x1 && p.y < y2 && p.y + b.h > y1) sel.blocks.add(b.id);
    }
    renderPanel(); render(); return;
  }
  if(gesture.type === 'blockdrag'){
    if(Math.abs(w.x - gesture.startX) + Math.abs(w.y - gesture.startY) > 2) gesture.moved = true;
    if(!gesture.moved) return;
    gesture.mx = w.x; gesture.my = w.y;
    if(doc.mode === 'canvas'){
      // apply snapped positions + compute alignment guides
      const dx = w.x - gesture.startX, dy = w.y - gesture.startY;
      const first = blockById(gesture.ids[0]);
      const o = gesture.orig.get(gesture.ids[0]);
      const nx = Math.round((o.x + dx) / SNAP) * SNAP;
      const ny = Math.round((o.y + dy) / SNAP) * SNAP;
      const sx = nx - o.x, sy = ny - o.y;
      for(const id of gesture.ids){
        const b = blockById(id); const oo = gesture.orig.get(id);
        b.x = oo.x + sx; b.y = oo.y + sy;
      }
      gesture.guides = computeGuides(first);
    } else {
      gesture.hoverCell = cellAt(w.x, w.y);
    }
    render(); return;
  }
});

window.addEventListener('pointerup', ev => {
  if(!gesture) return;
  const g = gesture; gesture = null;
  svg.classList.remove('panning','connecting');

  if(g.type === 'pan'){ save(); render(); return; }

  if(g.type === 'connect'){
    const targetId = hitBlock(ev) || (ev.target.closest('.lead') && ev.target.closest('.lead').getAttribute('data-id'));
    if(targetId) tryConnect(g.fromId, targetId);
    else render();
    return;
  }

  if(g.type === 'marquee'){ render(); renderPanel(); return; }

  if(g.type === 'routedrag'){
    if(!g.moved){
      const e=edgeById(g.id);
      if(e){ if(g.originalRoute) e.route=g.originalRoute; else delete e.route; }
      render(); return;
    }
    undoStack.push(g.undo); if(undoStack.length>100) undoStack.shift();
    redoStack.length=0; updateUndoBtns();
    afterMutation(); renderPanel(); toast('Custom route saved'); return;
  }

  if(g.type === 'blockdrag'){
    if(!g.moved){ render(); return; }   // plain click — selection already applied
    if(doc.mode === 'canvas'){
      commitMove(g, () => {});          // positions already mutated live; commit snapshot BEFORE is gone → use orig restore trick
      afterMutation();
    } else if(g.hoverCell){
      // drag-to-reassign in matrix / hybrid mode
      const L = activeLayout();
      const { ci, ri } = g.hoverCell;
      const col = L.cols[ci], row = L.rows[ri];
      const { xProp, yProp } = doc.matrix;
      // 'type' is a fixed shape and cannot be reassigned by dragging
      const xMut = xProp !== 'type', yMut = yProp !== 'type';
      const changed = g.ids.some(id => {
        const b = blockById(id);
        return (xMut && blockAxisVal(b,xProp) !== col.val) || (yMut && blockAxisVal(b,yProp) !== row.val);
      });
      if(changed){
        commit();
        for(const id of g.ids){
          const b = blockById(id);
          if(xMut) b[xProp] = col.val;
          if(yMut) b[yProp] = row.val;
        }
        afterMutation();
        toast(`Reassigned → ${col.label} / ${row.label}`);
      } else render();
    } else render();
    return;
  }
});

/* commit a canvas drag as one undo step (positions were mutated live) */
function commitMove(g, apply){
  undoStack.push(snapshotWithPositions(g));
  if(undoStack.length > 100) undoStack.shift();
  redoStack.length = 0; updateUndoBtns();
}
function snapshotWithPositions(g){
  const cur = JSON.stringify({ blocks:doc.blocks, edges:doc.edges, matrix:doc.matrix });
  // reconstruct pre-drag positions
  const pre = JSON.parse(cur);
  for(const b of pre.blocks){
    if(g.orig.has(b.id)){ b.x = g.orig.get(b.id).x; b.y = g.orig.get(b.id).y; }
  }
  return JSON.stringify(pre);
}

/* ---------- alignment guides (canvas mode) ---------- */
function computeGuides(dragged){
  if(!dragged) return null;
  const guides = [];
  const thr = 5 / view().k;
  const dPtsX = [dragged.x, dragged.x + dragged.w/2, dragged.x + dragged.w];
  const dPtsY = [dragged.y, dragged.y + dragged.h/2, dragged.y + dragged.h];
  let gx1=1e9, gx2=-1e9, gy1=1e9, gy2=-1e9;
  for(const b of doc.blocks){
    if(sel.blocks.has(b.id)) continue;
    const oPtsX = [b.x, b.x + b.w/2, b.x + b.w];
    const oPtsY = [b.y, b.y + b.h/2, b.y + b.h];
    for(const dx of dPtsX) for(const ox of oPtsX){
      if(Math.abs(dx - ox) < thr){
        guides.push({ axis:'v', at:ox, from:Math.min(b.y, dragged.y) - 12, to:Math.max(b.y+b.h, dragged.y+dragged.h) + 12 });
      }
    }
    for(const dy of dPtsY) for(const oy of oPtsY){
      if(Math.abs(dy - oy) < thr){
        guides.push({ axis:'h', at:oy, from:Math.min(b.x, dragged.x) - 12, to:Math.max(b.x+b.w, dragged.x+dragged.w) + 12 });
      }
    }
  }
  return guides.length ? guides : null;
}

/* ---------- hover tracing ---------- */
svg.addEventListener('pointermove', ev => {
  if(gesture) return;
  const bid = hitBlock(ev);
  if(bid === hoverId){ if(!bid && trace) {/* noop */} else return; }
  hoverId = bid || null;
  trace = hoverId ? computeTrace(hoverId) : null;
  render();
});

/* ---------- wheel zoom to cursor ---------- */
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const v = view();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const factor = Math.exp(-ev.deltaY * 0.0015);
  const k2 = clamp(v.k * factor, 0.15, 3);
  v.tx = mx - (mx - v.tx) * (k2 / v.k);
  v.ty = my - (my - v.ty) * (k2 / v.k);
  v.k = k2;
  render(); save();
}, { passive:false });

/* ---------- double-click inline label edit ---------- */
svg.addEventListener('dblclick', ev => {
  const bid = hitBlock(ev);
  if(!bid) return;
  const b = blockById(bid);
  const p = blockPos(b);
  const sp = worldToScreen(p.x, p.y);
  const inp = $('#inlineEdit');
  inp.style.display = 'block';
  // track the label's vertical position (it shifts up when badges are shown)
  const lift = 4.5 - badgeLayout(badgeLines(b).length).label;
  inp.style.left = sp.x + 'px'; inp.style.top = (sp.y + (b.h/2 - lift)*view().k - 14) + 'px';
  inp.style.width = Math.max(120, b.w * view().k) + 'px';
  inp.value = b.label;
  inp.focus(); inp.select();
  inp.onkeydown = e2 => {
    if(e2.key === 'Enter') inp.blur();
    if(e2.key === 'Escape'){ inp.onblur = null; inp.style.display = 'none'; }
  };
  inp.onblur = () => {
    inp.style.display = 'none';
    const val = inp.value.trim();
    if(val && val !== b.label){ commit(); b.label = val; afterMutation(); renderPanel(); }
  };
});

/* ---------- keyboard ---------- */
window.addEventListener('keydown', ev => {
  if(ev.target instanceof Element && ev.target.matches('input, textarea, select')) return;
  if(ev.code === 'Space' && !spaceDown){ spaceDown = true; svg.style.cursor = 'grab'; ev.preventDefault(); return; }
  const mod = ev.ctrlKey || ev.metaKey;
  if(mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey){ undo(); ev.preventDefault(); }
  else if(mod && (ev.key.toLowerCase() === 'y' || (ev.shiftKey && ev.key.toLowerCase() === 'z'))){ redo(); ev.preventDefault(); }
  else if(mod && ev.key.toLowerCase() === 'd'){ duplicateSelected(); ev.preventDefault(); }
  else if(ev.key === 'Delete' || ev.key === 'Backspace'){ deleteSelected(); ev.preventDefault(); }
  else if(!mod && ev.key.toLowerCase() === 'b'){ toggleDrawer(); ev.preventDefault(); }
  else if(ev.key === '?'){ showShortcuts(); ev.preventDefault(); }
  else if(ev.key === 'Escape'){ closeMenus(); clearSel(); hideLeadPop(); render(); }
});
window.addEventListener('keyup', ev => {
  if(ev.code === 'Space'){ spaceDown = false; svg.style.cursor = ''; }
});

/* ============================================================
   Property panel
   ============================================================ */
const panel = $('#panel'), panelBody = $('#panelBody');

/* Collapse handling: when collapsed, the panel slides away and a slim
   "Properties" tab stays at the right edge — selection/dragging is then
   completely unobstructed until the tab is clicked. State is persisted. */
function applyPanelVisibility(){
  const open = panel.classList.contains('open');
  const collapsed = open && doc.ui.panelCollapsed;
  panel.classList.toggle('collapsed', collapsed);
  $('#panelTab').style.display = collapsed ? 'block' : 'none';
  // v1.1: the panel (z25) sits above the drawer (z15) — pull the drawer's
  // right edge clear of it so no cell is ever hidden behind the panel
  $('#drawer').style.right = (open && !collapsed) ? panel.offsetWidth + 'px' : '0';
}
$('#panelCollapse').addEventListener('click', () => { doc.ui.panelCollapsed = true; save(); applyPanelVisibility(); });
$('#panelTab').addEventListener('click', () => { doc.ui.panelCollapsed = false; save(); applyPanelVisibility(); });

function enumOptions(prop){
  const vals = new Set();
  doc.blocks.forEach(b => { const v = (b[prop] || '').trim(); if(v) vals.add(v); });
  return [...vals].sort((a,b) => a.localeCompare(b));
}

function renderPanel(){
  renderPanelInner();
  applyPanelVisibility();
}
function renderPanelInner(){

  const relHtml = arr => arr.length

  $('#p-mh').addEventListener('change', e => {

  });
  $('#p-res').addEventListener('change', e => {

  const updEnum = (id, prop) => $(id).addEventListener('change', e => {
    if(e.target.value === '__add__'){
      const v = prompt('Add new option:');

function enumHtml(opts, cur){
  const o = [`<option value="">— unset —</option>`];
  for(const v of opts) o.push(`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`);
  o.push(`<option value="__add__">＋ Add new…</option>`);
  if(cur && !opts.includes(cur))
    o.splice(1, 0, `<option value="${esc(cur)}" selected>${esc(cur)}</option>`);
  return o.join('');
}
function renderEdgePanel(e){
  if(!e){ panel.classList.remove('open'); return; }
  panel.classList.add('open');
  $('#panelTitle').textContent = 'Edge properties';
  const a = blockById(e.from), b = blockById(e.to), rawPref=edgeRoutePrefs(e), pref=effectiveEdgeRoutePrefs(e);
  const square=doc.edgeStyle==='square', canvas=doc.mode==='canvas', savedCanvasCustom=!canvas&&rawPref.mode==='custom';
  panelBody.innerHTML = `
    <div class="fld"><label>From</label><input type="text" value="${esc(a ? a.label : '?')}" disabled></div>
    <div class="fld"><label>To</label><input type="text" value="${esc(b ? b.label : '?')}" disabled></div>
    <div class="fld"><label>Label</label><input type="text" id="e-label" value="${esc(e.label)}" placeholder="e.g. yes / no"></div>
    <div class="fld"><label>Square route</label><select id="e-route" ${square?'':'disabled'}>
      ${['auto','above','below','custom'].map(m=>`<option value="${m}" ${pref.mode===m?'selected':''} ${m==='custom'&&!canvas?'disabled':''}>${m[0].toUpperCase()+m.slice(1)}${m==='custom'&&!canvas?' (Canvas only)':''}</option>`).join('')}
    </select></div>
    <div class="fld"><label>Channel offset</label><div style="display:flex;gap:6px;align-items:center">
      <button class="btn" id="e-route-minus" ${!square||pref.mode==='custom'||savedCanvasCustom?'disabled':''} title="Shift channel up">−</button>
      <input type="text" value="${savedCanvasCustom?'Canvas custom':pref.mode==='custom'?'Custom':pref.offset+' px'}" disabled style="text-align:center;flex:1;min-width:0">
      <button class="btn" id="e-route-plus" ${!square||pref.mode==='custom'||savedCanvasCustom?'disabled':''} title="Shift channel down">＋</button>
    </div></div>
    <div class="fld"><button class="btn" id="e-route-reset" ${!e.route?'disabled':''} style="width:100%">Reset to automatic</button></div>
    <p class="rel-empty" style="border:none;background:none;padding:0;line-height:1.45">${!square?'Switch to Square routing to use route controls.':savedCanvasCustom?'Your Canvas custom route is saved and will return in Canvas. This view uses automatic routing.':!canvas?'Custom channels are Canvas-only. This view uses fresh automatic geometry; Above/Below remain available.':'Drag a selected route’s middle segment to create a custom channel. End leads stay fixed.'}</p>`;
  $('#e-label').addEventListener('change', ev => { commit(); e.label = ev.target.value.trim(); afterMutation(); });
  const updateRoute=(mode,offset=pref.offset)=>{
    if(mode==='custom' && !canvas) return;
    commit();
    if(mode==='custom'){
      const route=edgeGeom(e);
      e.route={mode:'custom',offset:0,points:route.points?cloneDocument(route.points.slice(1,-1)):[]};
    } else e.route={mode,offset,points:[]};
    afterMutation(); renderPanel();
  };
  $('#e-route').addEventListener('change',ev=>updateRoute(ev.target.value,ev.target.value==='custom'?0:pref.offset));
  $('#e-route-minus').addEventListener('click',()=>updateRoute(pref.mode==='custom'?'auto':pref.mode,pref.offset-20));
  $('#e-route-plus').addEventListener('click',()=>updateRoute(pref.mode==='custom'?'auto':pref.mode,pref.offset+20));
  $('#e-route-reset').addEventListener('click',()=>{ if(!e.route)return; commit(); delete e.route; afterMutation(); renderPanel(); });
}

const leadPop = $('#leadPop');
function openLeadPop(blockId, dir, cx, cy){
  const b = blockById(blockId); if(!b) return;
  const edges = dir === 'in' ? inEdges(blockId) : outEdges(blockId);
  leadPop.innerHTML = `<h4>${dir === 'in' ? 'Incoming' : 'Outgoing'} connections — ${esc(b.label)}</h4>`;
  if(!edges.length)
    leadPop.innerHTML += `<div class="rel-empty" style="padding:4px 2px">No connections</div>`;
  for(const e of edges){
    const other = blockById(dir === 'in' ? e.from : e.to);
    const row = document.createElement('div');
    row.className = 'lp-row';
    row.innerHTML = `<span class="who">${dir === 'in' ? '←' : '→'} ${esc(other ? other.label : '?')}</span>
      <input type="text" value="${esc(e.label)}" placeholder="label" title="Edge label">
      <button title="Remove connection">✕</button>`;
    row.querySelector('input').addEventListener('change', ev => { commit(); e.label = ev.target.value.trim(); afterMutation(); });
    row.querySelector('button').addEventListener('click', () => {
      commit(); doc.edges = doc.edges.filter(x => x.id !== e.id); afterMutation(); openLeadPop(blockId, dir, cx, cy);
    });
    leadPop.appendChild(row);
  }
  leadPop.style.display = 'block';
  leadPop.style.left = clamp(cx + 8, 8, innerWidth - 260) + 'px';
  leadPop.style.top  = clamp(cy - 10, 50, innerHeight - 120) + 'px';
}
function hideLeadPop(){ leadPop.style.display = 'none'; }
document.addEventListener('pointerdown', ev => {
  if(!leadPop.contains(ev.target) && !(ev.target.closest && ev.target.closest('.lead'))) hideLeadPop();
}, true);

function typeIcon(type){
  const style = 'fill="var(--block)" stroke="var(--muted)"';
  switch(type){
    case 'decision':   return `<polygon points="8,0 16,8 8,16 0,8" ${style}/>`;
    case 'terminator': return `<rect x="0" y="2" width="16" height="12" rx="6" ${style}/>`;
    case 'data':       return `<polygon points="4,1 17,1 13,15 0,15" ${style}/>`;
    case 'document':   return `<path d="M1,1 H15 V12 Q11,16 8,12 T1,12 Z" ${style}/>`;
    default:           return `<rect x="1" y="2" width="14" height="12" rx="2" ${style}/>`;
  }
}
/* Menus are position:fixed (toolbar scrolls horizontally on narrow screens, which
   would clip absolute menus) — place at the button, clamped inside the viewport. */
function placeMenu(btn, menu, alignRight){
  const r = btn.getBoundingClientRect();
  const maxLeft = Math.max(8, innerWidth - menu.offsetWidth - 8);
  menu.style.top = (r.bottom + 4) + 'px';
  menu.style.left = (alignRight ? clamp(r.right - menu.offsetWidth, 8, maxLeft)
                                : clamp(r.left, 8, maxLeft)) + 'px';
}
